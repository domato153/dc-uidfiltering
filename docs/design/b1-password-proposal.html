<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B1 비밀번호 창 독립 시안</title><style>
:root{color-scheme:light;--canvas:#f1f5f5;--fg:#27313f;--muted:#667780;--paper:#fff;--rim:#fffffff2;--border:#c4d4d4;--accent:#176f6a;--float:#ffffffc7;--sheen:linear-gradient(120deg,#ffffff70,#ffffff12 42%,transparent 65%);--shadow:0 12px 32px #2e5a5f12,0 1px 3px #3651560b}
:root.dark{color-scheme:dark;--canvas:#182124;--fg:#e4eceb;--muted:#a1b5b6;--paper:#20292c;--rim:#e4eceb17;--border:#3b5052;--accent:#248781;--float:#20292cd6;--sheen:linear-gradient(120deg,#ffffff16,transparent 58%);--shadow:0 14px 34px #0003,0 1px 2px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--fg);font-family:system-ui,sans-serif}header{width:min(760px,100%);margin:auto;padding:24px 16px 14px;border-bottom:1px solid var(--border);font-weight:650;font-size:20px}main{width:min(760px,100%);min-height:min(520px,calc(100dvh - 250px));padding:24px 12px;margin:auto;display:grid;place-items:center}.card{width:100%;max-width:520px;border:1px solid var(--rim);border-radius:16px;background:var(--sheen),var(--float);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(1.12);overflow:hidden}.panel{display:grid;gap:16px;padding:30px 26px 24px;text-align:center}.prompt{margin:0;font-size:17px;line-height:1.45;font-weight:650}.input{width:100%;height:50px;border:1px solid var(--border);border-radius:10px;background:var(--paper);color:var(--fg);padding:0 14px;font:500 17px/1 system-ui;outline-offset:3px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{min-height:46px;border:1px solid var(--border);border-radius:10px;color:var(--fg);background:var(--paper);font:650 15px/1.2 system-ui;padding:10px 12px}.primary{position:relative;background:linear-gradient(165deg,#ffffff1f,transparent 70%),var(--accent);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 #ffffff35,0 3px 7px #0a444219}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}@media(max-width:480px){.panel{padding:24px 18px 18px}}
</style><header>테스트 갤러리</header><main><div class="card"><div class="panel"><b class="prompt">비밀번호를 입력하세요.</b><input class="input" type="password" aria-label="비밀번호 입력" autocomplete="current-password"><div class="actions"><button>취소</button><button class="primary">확인</button></div></div></div></main><script>if(location.hash.includes('dark'))document.documentElement.classList.add('dark')</script></html>
